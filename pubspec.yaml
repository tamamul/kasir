name: kasir_marsa
description: Aplikasi kasir MARSA - client Flutter untuk backend Google Apps Script
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.6

  # Scan barcode pakai kamera
  mobile_scanner: ^7.0.0

  # Struk: render jadi gambar (share ke WA dll) & PDF (share/print dialog)
  screenshot: ^3.0.0
  share_plus: ^10.1.2
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.4

  # Cetak langsung ke printer thermal (Bluetooth/USB/Network)
  flutter_thermal_printer: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
